<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Bild-Studio & Adobe Stock Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Bild-Studio & Adobe Stock Generator</h1>
      <nav class="nav">
        <a href="./" aria-current="page">Studio</a>
        <a href="galerie.html">Galerie</a>
      </nav>
    </header>

    <!-- Eingabe, Auflösung & Modus -->
    <div class="card">
      <label class="prompt-label" for="promptInput">Bildbeschreibung (Prompt)</label>
      <textarea
        id="promptInput"
        rows="10"
        placeholder="Bildbeschreibung (Prompt) eingeben: Motiv, Umgebung, Licht, Stimmung, Perspektive ..."
      ></textarea>
      <div class="hint">Das Feld lässt sich unten rechts weiter aufziehen.</div>

      <div class="row options">
        <select id="modelSelect" aria-label="Modell">
          <option value="gemini-3-pro-image-preview">Nano Banana Pro (Studio)</option>
          <option value="gemini-nano-banana-2.1">Nano Banana 2.1 (Standard)</option>
        </select>
        <select id="sizeSelect" aria-label="Auflösung">
          <option value="2K" selected>2K (~4–5 MP – Adobe Minimum)</option>
          <option value="4K">4K (~16 MP – Maximum)</option>
          <option value="1K">1K (~1 MP – Nur Entwurf)</option>
        </select>
        <select id="ratioSelect" aria-label="Seitenverhältnis">
          <option value="3:2" selected>3:2 (Querformat)</option>
          <option value="2:3">2:3 (Hochformat)</option>
          <option value="16:9">16:9 (Breitbild)</option>
          <option value="9:16">9:16 (Vertikal)</option>
          <option value="1:1">1:1 (Quadrat)</option>
          <option value="4:3">4:3 (Klassisch)</option>
        </select>
      </div>

      <div class="row">
        <button id="singleBtn" onclick="generateSingle()">Sofort erstellen</button>
        <button class="secondary" onclick="addToQueue()">
          + In Batch-Warteschlange (50% Rabatt)
        </button>
      </div>
      <div id="singleStatus" class="status-msg"></div>

      <!-- Warteschlange -->
      <div
        id="queueSection"
        style="display: none; border-top: 1px solid #e2e8f0; padding-top: 12px; margin-top: 12px"
      >
        <strong>Aktuelle Warteschlange:</strong>
        <ul id="queueList" style="margin: 8px 0"></ul>
        <button id="submitBatchBtn" class="success" onclick="submitBatch()">Batch absenden</button>
      </div>
    </div>

    <!-- Batch-Aufträge (nur Status; die Bilder stehen in der Galerie) -->
    <div class="card">
      <div class="row" style="justify-content: space-between; align-items: center">
        <h3 style="margin: 0">Batch-Aufträge</h3>
        <button id="refreshJobsBtn" class="secondary" onclick="refreshJobs()">
          Status & Bilder aktualisieren
        </button>
      </div>
      <div id="jobsContainer" style="margin-top: 12px"></div>
    </div>

    <script src="common.js"></script>
    <script>
      // Warteschlange im Browser speichern, damit sie Neuladen und Deploys übersteht.
      // localStorage kann fehlen oder blockiert sein (privates Fenster) -> dann nur im Speicher.
      const QUEUE_KEY = 'bild-studio.queue';
      function loadQueue() {
        try {
          const saved = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
          return Array.isArray(saved) ? saved.filter((p) => typeof p === 'string' && p.trim()) : [];
        } catch {
          return [];
        }
      }
      function saveQueue() {
        try {
          if (queue.length) localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
          else localStorage.removeItem(QUEUE_KEY);
        } catch {
          // Speichern nicht möglich: Warteschlange bleibt bis zum Neuladen erhalten
        }
      }
      let queue = loadQueue();
      let allJobs = [];

      function addToQueue() {
        const input = document.getElementById('promptInput');
        if (!input.value.trim()) return;
        queue.push(input.value.trim());
        input.value = '';
        renderQueue();
      }

      function renderQueue() {
        const sec = document.getElementById('queueSection');
        const list = document.getElementById('queueList');
        const btn = document.getElementById('submitBatchBtn');
        sec.style.display = queue.length ? 'block' : 'none';
        list.innerHTML = queue
          .map(
            (p, i) =>
              `<li>${esc(p)} <a href="#" onclick="queue.splice(${i},1);renderQueue();return false;">[entfernen]</a></li>`,
          )
          .join('');
        btn.textContent = `Batch absenden (${queue.length} Bilder – 50% Rabatt)`;
        saveQueue();
      }

      async function generateSingle() {
        const prompt = document.getElementById('promptInput').value.trim();
        const model = document.getElementById('modelSelect').value;
        const imageSize = document.getElementById('sizeSelect').value;
        const aspectRatio = document.getElementById('ratioSelect').value;
        const btn = document.getElementById('singleBtn');
        const status = document.getElementById('singleStatus');

        if (!prompt) return;

        btn.disabled = true;
        status.textContent = `Generiere ${imageSize}-Bild (${aspectRatio})...`;

        try {
          const data = await postJson('api/generate-single', {
            prompt,
            model,
            imageSize,
            aspectRatio,
          });
          // Das Bild erscheint in der Galerie; hier nur Rückmeldung mit Links
          const src = esc(String(data.imageUrl).replace(/^\//, ''));
          status.innerHTML =
            `Fertig: ${esc(data.fileName)} (${esc(data.imageSize)}, ${esc(data.aspectRatio)}) – ` +
            `<a href="${src}" target="_blank">Bild öffnen</a> · ` +
            `<a href="galerie.html#ordner=none">in der Galerie (Ohne Kategorie)</a>`;
        } catch (err) {
          status.textContent = 'Fehler: ' + err.message;
        } finally {
          btn.disabled = false;
        }
      }

      async function submitBatch() {
        const model = document.getElementById('modelSelect').value;
        const imageSize = document.getElementById('sizeSelect').value;
        const aspectRatio = document.getElementById('ratioSelect').value;
        const btn = document.getElementById('submitBatchBtn');
        const status = document.getElementById('singleStatus');

        btn.disabled = true;
        try {
          await postJson('api/batch/start', { prompts: queue, model, imageSize, aspectRatio });
          queue = [];
          renderQueue();
          status.textContent = 'Batch abgesendet.';
          refreshJobs();
        } catch (err) {
          status.textContent = 'Fehler beim Batch-Start: ' + err.message;
        } finally {
          btn.disabled = false;
        }
      }

      // Höchstens eine Statusabfrage gleichzeitig aus dieser Seite (der Server bündelt
      // zusätzlich alle Abfragen zu einer einzigen bei Gemini)
      let jobsLoading = null;
      function refreshJobs() {
        if (!jobsLoading) {
          const btn = document.getElementById('refreshJobsBtn');
          btn.disabled = true;
          jobsLoading = loadJobs().finally(() => {
            jobsLoading = null;
            btn.disabled = false;
          });
        }
        return jobsLoading;
      }

      async function loadJobs() {
        const container = document.getElementById('jobsContainer');
        try {
          allJobs = await api('api/batch/status');
        } catch (err) {
          // Zuletzt geladene Aufträge stehen lassen: ein einzelner Fehlschlag darf die
          // bereits angezeigte Liste nicht leeren
          const errorHtml = `<p style="color:#dc2626;">Fehler beim Laden der Batch-Aufträge: ${esc(err.message)}</p>`;
          container.innerHTML = allJobs.length
            ? `${errorHtml}<p style="color:#64748b;">Angezeigt wird der zuletzt geladene Stand.</p>${renderJobs()}`
            : errorHtml;
          return;
        }

        container.innerHTML = allJobs.length
          ? renderJobs()
          : '<p style="color:#64748b;">Noch keine Batch-Aufträge vorhanden.</p>';
      }

      function renderJobs() {
        return allJobs
          .map((job) => {
            const imageCount = (job.images || []).length;
            return `
        <div class="job-row">
          <div>
            <strong>${esc(job.name)}</strong> <span class="badge">${esc(job.state)}</span>
            <span style="font-size: 13px; color: #475569;">(${esc(job.count)} Bilder | ${esc(job.imageSize || '2K')} | ${esc(job.aspectRatio || '3:2')})</span>
          </div>
          ${
            imageCount
              ? `<a class="btn-link" href="galerie.html">${imageCount} Bilder in der Galerie</a>`
              : ''
          }
        </div>`;
          })
          .join('');
      }

      renderQueue();
      refreshJobs();
    </script>
  </body>
</html>
