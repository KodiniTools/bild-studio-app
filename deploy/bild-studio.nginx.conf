# Bild-Studio (gemini-studio) unter https://kodinitools.com/bild-studio/
# Einbinden im server { ... }-Block von kodinitools.com:
#   include /etc/nginx/snippets/bild-studio.conf;

location = /bild-studio {
    return 301 /bild-studio/;
}

# ^~ ist wichtig: Ohne ^~ gewinnen Regex-Locations (location ~ ...) aus dem übrigen
# server-Block gegen dieses Präfix. Dann landet z. B. /bild-studio/api/batch/status
# nicht beim Backend (HTML-404 statt JSON) und auch der Passwortschutz greift nicht.
location ^~ /bild-studio/ {
    # Passwortschutz: die App erzeugt kostenpflichtige API-Aufrufe
    auth_basic           "Bild-Studio";
    auth_basic_user_file /etc/nginx/.htpasswd-bild-studio;

    # Slash am Ende ist wichtig: /bild-studio/api/x -> http://127.0.0.1:3018/api/x
    proxy_pass http://127.0.0.1:3018/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 180s;
    proxy_connect_timeout 180s;
    proxy_send_timeout 180s;
}
